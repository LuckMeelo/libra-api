name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        projects: [ "ApiLib", "LibrApi" ]
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies for ${{ matrix.projects }}
      run: dotnet restore ./LibrApi/${{ matrix.projects }}/${{ matrix.projects }}.csproj

    - name: Build ${{ matrix.projects }}
      run: dotnet build ./LibrApi/${{ matrix.projects }}/${{ matrix.projects }}.csproj --configuration Release --no-restore

    - name: Run Api tests
      run: dotnet test ./LibrApi/ApiLib.Tests/ApiLib.Tests.csproj --no-build

    - name: Run Lib tests
      run: dotnet test ./LibrApi/LibrApi.Tests/LibrApi.Tests.csproj --no-build